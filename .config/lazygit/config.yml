os:
  open: "nvim {{filename}}"
git:
  diffRenderers:
    - command: delta --paging=never --hunk-header-style=omit --file-style=omit --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      colorArg: never
gui:
  border: single
  scrollHeight: 5
  showFileIcons: false
  showFileTree: false
  tabWidth: 2
quitOnTopLevelReturn: true
# Some of these requiore `gh repo set-default` to work with forks
customCommands:
  - key: "D"
    context: "localBranches"
    description: "Trim local branches whose remotes are gone from upstream"
    command: >
      git fetch --prune && git for-each-ref --format '%(refname:short) %(upstream:track)' refs/heads | grep '\[gone\]' | cut -d' ' -f1 | xargs -r git branch -D

  - key: "v"
    context: "localBranches"
    command: "gh pr checkout {{.Form.PullRequestNumber}}"
    description: "Select GitHub PR for Checkout"
    loadingText: "Checking out GitHub Pull Request..."
    prompts:
      - type: "menuFromCommand"
        title: "Which PR do you want to check out?"
        key: "PullRequestNumber"
        command: |-
          gh pr list --json number,title,headRefName --template '{{`{{range .}}{{printf "#%v: %s - %s" .number .title .headRefName}}
          {{end}}`}}'
        filter: "#(?P<number>[0-9]+): (?P<title>.+) - (?P<ref_name>[^ ]+)"
        valueFormat: "{{.number}}"
        labelFormat: '{{"#" | black | bold}}{{.number | white | bold}} {{.title | yellow | bold}}{{" [" | black | bold}}{{.ref_name | green}}{{"]" | black | bold}}'
  - key: "x"
    command: "open -R {{.SelectedFile.Name}}"
    context: "files"
    description: "Reveal in Finder"
  - key: "R"
    context: "files"
    command: "git checkout {{.Form.Branch}} -- {{.SelectedFile.Name}}"
    description: "Restore file from another branch"
    loadingText: "Restoring file..."
    prompts:
      - type: "menuFromCommand"
        title: "Restore {{.SelectedFile.Name}} from which branch?"
        key: "Branch"
        command: "git branch --format='%(refname:short)'"
        filter: "(?P<branch>.+)"
        valueFormat: "{{.branch}}"
        labelFormat: "{{.branch}}"
  - key: "x"
    command: "gh repo view --web --branch {{.SelectedLocalBranch.Name}}"
    context: "localBranches"
    description: "Open branch in browser"
  - key: "x"
    command: "gh repo view --web --branch {{.SelectedRemoteBranch.Name}}"
    context: "remoteBranches"
    description: "Open branch in browser"
  - key: "n"
    context: "worktrees"
    description: "New worktree from current branch"
    prompts:
      - type: "input"
        title: "Create a new worktree from {{ .CheckedOutBranch.Name }} with what name?"
        key: "Name"
        initialValue: ""
    command: "lazygit-worktree-new {{.Form.Name}} {{.CheckedOutBranch.Name}}"
    loadingText: "Creating worktree..."
    output: log
  - key: "w"
    context: "localBranches"
    description: "New worktree for branch"
    command: "lazygit-worktree-add {{.SelectedLocalBranch.Name}}"
    loadingText: "Creating worktree..."
    output: log
  - key: "D"
    context: "worktrees"
    description: "Trim worktrees whose branches remotes are gone from upstream"
    command: "lazygit-worktree-trim"
    loadingText: "Trimming worktrees..."
    output: log
