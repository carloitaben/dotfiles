os:
  open: "zed {{filename}}"
git:
  diffRenderers:
    - command: delta --paging=never --hunk-header-style=omit --file-style=omit --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
      colorArg: never
gui:
  border: single
  scrollHeight: 5
  showFileIcons: false
  showFileTree: false
  tabWidth: 2
quitOnTopLevelReturn: true
# Some of these requiore `gh repo set-default` to work with forks
customCommands:
  - key: "D"
    context: "localBranches"
    description: "Prune gone branches"
    command: >
      git fetch --prune && git for-each-ref --format '%(refname:short) %(upstream:track)' refs/heads | grep '\[gone\]' | cut -d' ' -f1 | xargs -r git branch -D

  - key: "v"
    context: "localBranches"
    command: "gh pr checkout {{.Form.PullRequestNumber}}"
    description: "Select GitHub PR for Checkout"
    loadingText: "Checking out GitHub Pull Request"
    prompts:
      - type: "menuFromCommand"
        title: "Which PR do you want to check out?"
        key: "PullRequestNumber"
        command: |-
          gh pr list --limit 200 --json number,title,headRefName --template '{{`{{range .}}{{printf "#%v: %s - %s" .number .title .headRefName}}
          {{end}}`}}'
        filter: "#(?P<number>[0-9]+): (?P<title>.+) - (?P<ref_name>[^ ]+)"
        valueFormat: "{{.number}}"
        labelFormat: '{{"#" | black | bold}}{{.number | white | bold}} {{.title | yellow | bold}}{{" [" | black | bold}}{{.ref_name | green}}{{"]" | black | bold}}'
  - key: "x"
    command: "open -R {{.SelectedFile.Name}}"
    context: "files"
    description: "Reveal in Finder"
  - key: "b"
    context: "files"
    command: "git checkout {{.Form.Branch}} -- {{.SelectedFile.Name}}"
    description: "Restore file from another branch"
    loadingText: "Restoring file"
    prompts:
      - type: "menuFromCommand"
        title: "Restore {{.SelectedFile.Name}} from which branch?"
        key: "Branch"
        command: "git branch --format='%(refname:short)'"
        filter: "(?P<branch>.+)"
        valueFormat: "{{.branch}}"
        labelFormat: "{{.branch}}"
  - key: "x"
    command: "gh repo view --web --branch {{.SelectedLocalBranch.Name}}"
    context: "localBranches"
    description: "Open branch in browser"
  - key: "x"
    command: "gh repo view --web --branch {{.SelectedRemoteBranch.Name}}"
    context: "remoteBranches"
    description: "Open branch in browser"
  # Mirrors native worktree remove (menu, main/current guard) but moves to Trash
  - key: "d"
    context: "worktrees"
    description: "Remove worktree (to Trash)"
    loadingText: "Removing worktree"
    prompts:
      - type: "menu"
        title: "Remove worktree '{{.SelectedWorktree.Name}}'?"
        key: "Mode"
        options:
          - name: "Remove worktree"
            key: "w"
            value: "worktree"
          - name: "Remove worktree and delete branch"
            key: "b"
            value: "branch"
          - name: "Remove worktree and delete local and remote branch"
            key: "r"
            value: "both"
    command: >
      if [ "{{.SelectedWorktree.IsMain}}" = true ]; then echo "You cannot remove the main worktree!" >&2; exit 1; fi;
      if [ "{{.SelectedWorktree.IsCurrent}}" = true ]; then echo "You cannot remove the current worktree!" >&2; exit 1; fi;
      branch='{{.SelectedWorktree.Branch}}'; mode='{{.Form.Mode}}';
      if [ "$mode" != worktree ] && [ -z "$branch" ]; then echo "Worktree is not checked out on a branch" >&2; exit 1; fi;
      remote=$(git config "branch.$branch.remote");
      if [ "$mode" = both ] && [ -z "$remote" ]; then echo "Branch has no upstream" >&2; exit 1; fi;
      mv '{{.SelectedWorktree.Path}}' "$HOME/.Trash/$(basename '{{.SelectedWorktree.Path}}')-$(date +%s)" &&
      git worktree prune &&
      if [ "$mode" != worktree ]; then git branch -d "$branch"; fi &&
      if [ "$mode" = both ]; then git push "$remote" --delete "$branch"; fi
  - key: "D"
    context: "worktrees"
    description: "Remove all worktrees except main (to Trash)"
    loadingText: "Removing worktrees"
    prompts:
      - type: "confirm"
        title: "Remove all worktrees?"
        body: "Moves every worktree except the main one to the Trash."
    command: >
      i=0; stamp=$(date +%s);
      git worktree list --porcelain | awk '/^worktree /{n++; if (n>1) print substr($0,10)}' | while IFS= read -r wt; do i=$((i+1)); mv "$wt" "$HOME/.Trash/$(basename "$wt")-$stamp-$i"; done;
      git worktree prune
