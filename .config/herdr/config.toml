onboarding = false

[theme]
name = "vesper"
auto_switch = false

[keys]
# cmd+j is the prefix — Zed's terminal keybind repurposed as "the terminal
# layer". CapsLock=Cmd makes cmd ergonomic, zsh ignores cmd, and Ghostty
# forwards unbound cmd keys. cmd+j + <key> = herdr/terminal ops.
# Pane navigation is herdr-native `prefix+h/j/k/l` (focus_pane_* defaults),
# mirroring nvim's ctrl+w+h/j/k/l idiom — no direct ctrl+h/j/k/l binds.
prefix = "cmd+j"
# Zed's Shift+Esc full-pane zoom == herdr's native `zoomed` pane placement.
zoom = ["shift+esc", "prefix+z"]
# Mirror vim's ctrl-w splits: prefix+v (vertical, default) and prefix+s
# (horizontal). Settings moves off `s` to prefix+, (macOS cmd+, convention).
split_horizontal = "prefix+s"
settings = "prefix+,"
reload_config = "prefix+shift+,"
new_tab = "prefix+n"
new_workspace = "prefix+shift+n"
previous_tab = "prefix+["
next_tab = "prefix+]"
rename_tab = "prefix+f2"
rename_workspace = ""
# Prefix close bindings; avoid Ghostty's Cmd-W window close.
close_pane = "prefix+w"
close_tab = "prefix+shift+x"
close_workspace = "prefix+shift+w"
# Herdr-native worktree UI (create/open); lazygit worktrees stay vanilla.
new_worktree = "ctrl+cmd+w"

[ui]
prompt_new_tab_name = false
pane_scrollbars = false

agent_panel_sort = "spaces"
[ui.sidebar.agents]
# Show each agent's state (blocked/working/done/idle) as icon + text.
rows = [["state_icon", "state_text", "agent"], ["workspace", "tab"]]

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "herdr pane zoom \"$HERDR_ACTIVE_PANE_ID\" --off >/dev/null 2>&1; herdr pane move \"$HERDR_ACTIVE_PANE_ID\" --new-tab --focus"
description = "move pane to new tab (vim ctrl-w T)"

# Swap panes: mirrors vim ctrl-w H/J/K/L (move window in direction), here
# implemented as swap-with-neighbor since herdr panes don't reflow like vim
# windows. prefix+shift+h/j/k/l sits next to focus_pane_h/j/k/l (prefix+h/j/k/l).
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "herdr pane swap --direction left --current"
description = "swap pane left (vim ctrl-w H)"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "herdr pane swap --direction down --current"
description = "swap pane down (vim ctrl-w J)"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "herdr pane swap --direction up --current"
description = "swap pane up (vim ctrl-w K)"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "herdr pane swap --direction right --current"
description = "swap pane right (vim ctrl-w L)"

[[keys.command]]
key = "cmd+shift+g"
type = "popup"
command = "lazygit"
description = "lazygit (floating)"
width = "100%"
height = "100%"

[[keys.command]]
key = "cmd+alt+o"
type = "popup"
command = "~/.config/herdr/bin/open-recent-repo"
description = "open recent repo (fzf)"
width = 90
height = 40

[ui.toast]
delivery = "herdr"
