onboarding = false

[theme]
name = "vesper"
auto_switch = false

[keys]
# No tmux muscle memory to preserve; ctrl+b is herdr's documented default so
# `prefix+?` help, docs, and community examples all line up. It also doesn't
# collide with the vim-style ctrl+h/j/k/l pane-navigation chords below.
prefix = "ctrl+b"
# Zed's Shift+Esc full-pane zoom == herdr's native `zoomed` pane placement.
zoom = ["shift+esc", "prefix+z"]

[ui.sidebar.agents]
# Show each agent's state (blocked/working/done/idle) as icon + text.
rows = [["state_icon", "state_text", "agent"], ["workspace", "tab"]]

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left (vim/herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down (vim/herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right (vim/herdr)"

[[keys.command]]
key = "cmd+shift+g"
type = "popup"
command = "lazygit"
description = "lazygit (floating)"
width = "80%"
height = "80%"
