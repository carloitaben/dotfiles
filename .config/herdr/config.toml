onboarding = false

[theme]
name = "vesper"
auto_switch = false

[keys]
# cmd+j is the prefix — Zed's terminal keybind repurposed as "the terminal
# layer". CapsLock=Cmd makes cmd ergonomic, zsh ignores cmd, and Ghostty
# forwards unbound cmd keys. cmd+j + <key> = herdr/terminal ops.
# Pane navigation is herdr-native `prefix+h/j/k/l` (focus_pane_* defaults),
# mirroring nvim's ctrl+w+h/j/k/l idiom — no direct ctrl+h/j/k/l binds.
prefix = "cmd+j"
# Zed's Shift+Esc full-pane zoom == herdr's native `zoomed` pane placement.
zoom = ["shift+esc", "prefix+z"]
# Mirror vim's ctrl-w splits: prefix+v (vertical, default) and prefix+s
# (horizontal). Settings moves off `s` to prefix+, (macOS cmd+, convention).
split_horizontal = "prefix+s"
settings = "prefix+,"
# Mirror vim's ctrl-w close/new-tab: prefix+c close pane, prefix+t new tab.
# rename_tab is secondary — moves to prefix+shift+m; prefix+shift+t becomes
# move-pane-to-new-tab (see [[keys.command]] below).
close_pane = "prefix+c"
new_tab = "prefix+t"
rename_tab = "prefix+shift+m"
# Close tab = prefix+cmd+w (Zed cmd+w muscle memory). Distinct from prefix+w.
close_tab = "prefix+cmd+w"

[ui.sidebar.agents]
# Show each agent's state (blocked/working/done/idle) as icon + text.
rows = [["state_icon", "state_text", "agent"], ["workspace", "tab"]]

[[keys.command]]
key = "prefix+shift+t"
type = "shell"
command = "herdr pane zoom \"$HERDR_ACTIVE_PANE_ID\" --off >/dev/null 2>&1; herdr pane move \"$HERDR_ACTIVE_PANE_ID\" --new-tab --focus"
description = "move pane to new tab (vim ctrl-w T)"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"
description = "resize left (vim/herdr)"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"
description = "resize down (vim/herdr)"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"
description = "resize up (vim/herdr)"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"
description = "resize right (vim/herdr)"

[[keys.command]]
key = "cmd+shift+g"
type = "popup"
command = "lazygit"
description = "lazygit (floating)"
width = "80%"
height = "80%"

[[keys.command]]
key = "cmd+alt+o"
type = "popup"
command = "~/.config/herdr/bin/open-recent-repo"
description = "open recent repo (fzf)"
width = 90
height = 40

[[keys.command]]
key = "cmd+shift+r"
type = "shell"
command = "~/.config/herdr/bin/bun-repl launch"
description = "Bun REPL"
