id = "carloitaben.nvim-server"
name = "Persistent Neovim"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Start the shared headless Neovim server when Herdr starts"
platforms = ["macos", "linux"]

[[startup]]
command = ["sh", "-c", "$HERDR_PLUGIN_ROOT/../../../../bin/nvim-herdr-start"]
